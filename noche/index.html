<title>La Noche Sticky Knife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   LA NOCHE · Sticky Knife
   La web que abre el comensal durante la cena.

   Un solo mundo visual, a propósito: esto se usa en una mesa
   a media luz, con velas. No hay tema claro — una pantalla
   blanca en esa mesa arruina la noche y la visión nocturna.
   Todos los colores se pintan explícitos.
   ============================================================ */
:root{
  /* --- paleta tomada del logo real --- */
  --brasa:#E9541D;          /* naranja del círculo de la marca */
  --rojo:#DE3126;           /* rojo del lettering STICKY KNIFE */
  --verde:#5C8340;          /* verde de los cogollos, subido para leer en negro */
  --resina:#E8B15C;         /* ámbar del extracto */

  --noche:#08090B;
  --carbon:#101318;
  --carbon-2:#171B21;
  --linea:#242931;
  --linea-suave:#191D23;

  --hueso:#F0E9D6;          /* crema de la hoja */
  --ceniza:#959BA4;
  --humo:#5B626C;

  --ok:var(--verde);
  --alerta:#DE3126;

  --f-plato:"Fraunces",Georgia,"Times New Roman",serif;
  --f-titulo:"Big Shoulders Display","Archivo Narrow",system-ui,sans-serif;
  --f-texto:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-dato:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --r:12px; --r-lg:20px; --r-pill:999px;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  background:var(--noche); color:var(--hueso);
  font-family:var(--f-texto); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{margin:0; font-weight:400; text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brasa);outline-offset:3px;border-radius:6px}
::selection{background:rgba(233,84,29,.34)}
.dato{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --- la brasa que ilumina la pantalla --- */
.brasa-fondo{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 62% at 50% -12%, rgba(233,84,29,.22), transparent 62%),
    radial-gradient(90% 44% at 50% 108%, rgba(232,177,92,.09), transparent 60%);
  animation:respirar 11s ease-in-out infinite;
}
@keyframes respirar{0%,100%{opacity:.82}50%{opacity:1}}

/* ============================================================ marca */
.marca{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:26px 20px 6px;text-align:center;
}
.marca .sello{
  width:82px;height:82px;border-radius:22px;overflow:hidden;
  display:grid;place-items:center;
  background:linear-gradient(168deg,var(--carbon-2),var(--carbon));
  border:1px solid var(--linea);
  box-shadow:0 0 0 1px rgba(233,84,29,.16), 0 20px 50px -18px rgba(233,84,29,.55);
}
.marca .sello img{width:100%;height:100%;object-fit:cover;display:block}
.marca .sello svg{width:50px;height:50px;display:block}
.marca .nombre{
  font-family:var(--f-titulo);font-weight:800;font-size:27px;
  letter-spacing:.13em;text-transform:uppercase;line-height:1;
}
.marca .bajo{
  font-family:var(--f-dato);font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--humo);
}
.marca.chica{padding-top:16px;gap:7px}
.marca.chica .sello{width:50px;height:50px;border-radius:14px}
.marca.chica .sello svg{width:30px;height:30px}
.marca.chica .nombre{font-size:17px;letter-spacing:.16em}
.marca.chica .bajo{display:none}

/* ============================================================ layout */
.hoja{
  position:relative;z-index:2;
  width:100%;max-width:560px;margin-inline:auto;
  padding-inline:22px; padding-block:0 120px;
}
.centro{text-align:center}
.pila{display:flex;flex-direction:column;gap:18px}
.fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.rotulo{
  font-family:var(--f-titulo);font-weight:700;font-size:12px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--humo);
}
.regla{height:1px;background:var(--linea);border:none;margin:0}
.regla-brasa{
  height:1px;border:none;margin:0;
  background:linear-gradient(90deg,transparent,var(--brasa),transparent);
  opacity:.5;
}

.tarjeta{
  background:var(--carbon);border:1px solid var(--linea);
  border-radius:var(--r-lg);padding:20px;
}
.tarjeta.tenue{background:var(--carbon-2);border-color:var(--linea-suave)}

/* ============================================================ botones */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:52px;padding:14px 24px;border-radius:var(--r-pill);
  font-weight:600;font-size:16px;letter-spacing:.01em;
  border:1px solid var(--linea);background:var(--carbon-2);color:var(--hueso);
  transition:transform .1s, background .15s, border-color .15s;
}
.bt:active{transform:scale(.975)}
.bt.pri{
  background:var(--brasa);border-color:var(--brasa);color:#fff;
  box-shadow:0 10px 30px -12px rgba(233,84,29,.75);
}
.bt.ancho{width:100%}
.bt.chico{min-height:38px;padding:8px 16px;font-size:14px}
.bt.plano{background:transparent;border-color:transparent;color:var(--ceniza)}
.bt.plano:active{background:var(--carbon-2)}
.bt svg{width:19px;height:19px;stroke-width:1.8;flex:0 0 19px}
.bt[disabled]{opacity:.4;pointer-events:none}

/* ============================================================ EL PASO */
.paso-cab{
  display:flex;align-items:baseline;gap:14px;
  padding-top:6px;padding-bottom:14px;
}
.paso-n{
  font-family:var(--f-titulo);font-weight:800;
  font-size:clamp(58px,19vw,84px);line-height:.78;
  color:var(--brasa);font-variant-numeric:tabular-nums;
}
.paso-de{
  font-family:var(--f-dato);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--humo);line-height:1.5;
}
.plato{
  font-family:var(--f-plato);font-weight:300;
  font-size:clamp(29px,7.6vw,40px);line-height:1.12;
  letter-spacing:-.012em;margin-top:2px;
}
.plato-desc{
  font-size:15.5px;color:var(--ceniza);line-height:1.6;margin-top:13px;
  max-width:48ch;
}

/* --- el extracto --- */
.extracto{
  margin-top:24px;padding:20px;border-radius:var(--r-lg);
  background:linear-gradient(166deg, rgba(232,177,92,.11), rgba(232,177,92,.03));
  border:1px solid rgba(232,177,92,.26);
}
.extracto .qva{
  font-family:var(--f-titulo);font-weight:700;font-size:11.5px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--resina);opacity:.75;
}
.extracto .nom{
  font-family:var(--f-plato);font-weight:600;font-size:26px;
  color:var(--resina);line-height:1.15;margin-top:5px;
}
.extracto .fic{
  display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;
}
.chip-dato{
  font-family:var(--f-dato);font-size:11.5px;letter-spacing:.03em;
  padding:4px 10px;border-radius:var(--r-pill);
  background:rgba(232,177,92,.11);border:1px solid rgba(232,177,92,.24);
  color:var(--resina);white-space:nowrap;
}
.extracto .quien{
  margin-top:14px;padding-top:13px;border-top:1px solid rgba(232,177,92,.2);
  font-size:13.5px;color:var(--ceniza);
}
.extracto .quien b{color:var(--hueso);font-weight:600}

/* --- el ritual --- */
.ritual{margin-top:24px}
.ritual ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ritual li{
  display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start;
  padding:13px 0;border-bottom:1px solid var(--linea-suave);
}
.ritual li:last-child{border-bottom:none}
.ritual .paso-i{
  font-family:var(--f-titulo);font-weight:800;font-size:19px;
  color:var(--brasa);text-align:center;line-height:1.35;
}
.ritual .txt{font-size:15.5px;line-height:1.5}
.ritual .txt em{
  font-style:normal;font-family:var(--f-dato);font-size:14px;
  color:var(--resina);
}

/* ============================================================ UNA PALABRA */
.palabra-zona{margin-top:30px}
.pregunta{
  font-family:var(--f-plato);font-weight:300;
  font-size:clamp(25px,6.6vw,32px);line-height:1.18;text-align:center;
}
.sugeridas{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;
}
.sug{
  padding:10px 17px;border-radius:var(--r-pill);
  border:1px solid var(--linea);background:var(--carbon-2);
  font-size:15px;transition:transform .1s,border-color .15s,background .15s;
}
.sug:active{transform:scale(.94)}
.sug[aria-pressed="true"]{
  background:var(--brasa);border-color:var(--brasa);color:#fff;font-weight:600;
}
.campo-palabra{
  display:flex;gap:9px;margin-top:16px;
}
.campo-palabra input{
  flex:1 1 auto;min-width:0;
  background:var(--carbon-2);border:1px solid var(--linea);
  border-radius:var(--r-pill);padding:14px 20px;font-size:17px;
  text-align:center;
}
.campo-palabra input::placeholder{color:var(--humo)}
.campo-palabra input:focus{outline:none;border-color:var(--brasa);background:var(--carbon)}

/* la nube de la mesa */
.nube{
  display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  margin-top:22px;
}
.pal{
  font-family:var(--f-plato);font-weight:400;
  padding:7px 15px;border-radius:var(--r-pill);
  background:var(--carbon-2);border:1px solid var(--linea);
  color:var(--ceniza);
  animation:aparecer .5s cubic-bezier(.2,.9,.3,1) backwards;
}
.pal.mia{
  background:rgba(233,84,29,.18);border-color:var(--brasa);color:var(--hueso);
}
.pal.eco{color:var(--resina);border-color:rgba(232,177,92,.34);background:rgba(232,177,92,.09)}
.pal .n{font-family:var(--f-dato);font-size:11px;opacity:.6;margin-left:6px}
@keyframes aparecer{from{opacity:0;transform:translateY(7px) scale(.94)}to{opacity:1;transform:none}}
.nube-pie{
  text-align:center;font-size:12.5px;color:var(--humo);margin-top:14px;
}

/* ============================================================ EL PULSO */
.pulso{margin-top:14px}
.pulso-riel{
  position:relative;height:56px;border-radius:var(--r-pill);
  background:linear-gradient(90deg, var(--carbon-2), rgba(233,84,29,.32));
  border:1px solid var(--linea);overflow:hidden;touch-action:none;cursor:pointer;
}
.pulso-lleno{
  position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg, rgba(232,177,92,.30), var(--brasa));
  transition:width .12s linear;
}
.pulso-perilla{
  position:absolute;top:50%;width:38px;height:38px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--hueso);
  box-shadow:0 4px 16px rgba(0,0,0,.6);transition:left .12s linear;
  display:grid;place-items:center;
}
.pulso-perilla i{width:11px;height:11px;border-radius:50%;background:var(--brasa);display:block}
.pulso-extremos{
  display:flex;justify-content:space-between;margin-top:9px;
  font-family:var(--f-dato);font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--humo);
}
.pulso-lectura{
  text-align:center;font-family:var(--f-plato);font-size:21px;
  margin-top:14px;color:var(--resina);min-height:30px;
}

/* ============================================================ vela */
body.velando .apagable{opacity:.06;transition:opacity 1.4s ease}
body:not(.velando) .apagable{transition:opacity .3s ease}
.vela-aviso{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  display:none;flex-direction:column;align-items:center;gap:10px;
  padding:0 22px 44px;pointer-events:none;
}
body.velando .vela-aviso{display:flex}
.vela-aviso .ascua{
  width:8px;height:8px;border-radius:50%;background:var(--brasa);
  box-shadow:0 0 18px 5px rgba(233,84,29,.6);
  animation:latir 3.4s ease-in-out infinite;
}
@keyframes latir{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
.vela-aviso .qsuena{
  font-family:var(--f-plato);font-size:19px;color:var(--ceniza);text-align:center;
}
.vela-aviso .tocar{
  font-family:var(--f-dato);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--humo);
}

/* ============================================================ barra baja */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:linear-gradient(to top, var(--noche) 62%, rgba(8,9,11,0));
  padding:22px 22px calc(18px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;
}
.barra .adentro{width:100%;max-width:560px;display:flex;gap:10px;align-items:center}
body.velando .barra{opacity:.06;transition:opacity 1.4s ease}

/* ============================================================ hitos / antes */
.cuenta{
  font-family:var(--f-titulo);font-weight:800;
  font-size:clamp(52px,16vw,76px);line-height:.85;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.cuenta small{
  display:block;font-family:var(--f-dato);font-size:11px;font-weight:400;
  letter-spacing:.26em;text-transform:uppercase;color:var(--humo);margin-top:12px;
}
.dl{display:flex;flex-direction:column;gap:0}
.dl .par{
  display:flex;justify-content:space-between;gap:16px;align-items:baseline;
  padding:14px 0;border-bottom:1px solid var(--linea-suave);
}
.dl .par:last-child{border-bottom:none}
.dl .k{
  font-family:var(--f-titulo);font-weight:700;font-size:11.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--humo);flex:0 0 auto;
}
.dl .v{text-align:right;font-size:15.5px}
.dl .v a{color:var(--resina);text-decoration:none;border-bottom:1px solid rgba(232,177,92,.4)}

/* ============================================================ después */
.recuerdo-paso{
  padding:20px 0;border-bottom:1px solid var(--linea-suave);
}
.recuerdo-paso:last-of-type{border-bottom:none}
.recuerdo-paso .cab{display:flex;align-items:baseline;gap:12px}
.recuerdo-paso .nn{
  font-family:var(--f-titulo);font-weight:800;font-size:24px;color:var(--brasa);
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
.recuerdo-paso .pl{font-family:var(--f-plato);font-weight:300;font-size:21px;line-height:1.2}
.recuerdo-paso .ex{font-size:13.5px;color:var(--resina);margin-top:6px;font-family:var(--f-dato)}
.album{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:14px;
}
.album img{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
  border:1px solid var(--linea);display:block;background:var(--carbon-2);
}
.album .sumar{
  aspect-ratio:1;border-radius:10px;border:1px dashed var(--linea);
  display:grid;place-items:center;color:var(--humo);background:var(--carbon-2);
}
.album .sumar svg{width:20px;height:20px;stroke-width:1.6}

/* ============================================================ hoja modal */
.velo{
  position:fixed;inset:0;z-index:60;background:rgba(4,5,7,.78);
  backdrop-filter:blur(6px);display:grid;place-items:end center;
}
.velo[hidden]{display:none!important}
.hojita{
  width:100%;max-width:560px;background:var(--carbon);
  border:1px solid var(--linea);border-bottom:none;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  max-height:92vh;display:flex;flex-direction:column;
  animation:subir .24s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes subir{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){
  .velo{place-items:center;padding:24px}
  .hojita{border-radius:var(--r-lg);border-bottom:1px solid var(--linea);max-height:86vh}
}
.hojita-cab{
  display:flex;align-items:center;gap:12px;padding:18px 22px;
  border-bottom:1px solid var(--linea-suave);
}
.hojita-cab h3{
  font-family:var(--f-titulo);font-weight:800;font-size:21px;
  letter-spacing:.08em;text-transform:uppercase;flex:1 1 auto;
}
.hojita-cue{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.hojita-pie{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--linea-suave)}
.ico{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--ceniza);background:var(--carbon-2);flex:0 0 38px;
}
.ico svg{width:18px;height:18px;stroke-width:1.9}

.campo{display:flex;flex-direction:column;gap:7px}
.campo label{
  font-family:var(--f-titulo);font-weight:700;font-size:11.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--humo);
}
.campo .pista{font-size:12.5px;color:var(--humo);line-height:1.45}
.ent{
  background:var(--carbon-2);border:1px solid var(--linea);border-radius:var(--r);
  padding:13px 15px;font-size:16px;width:100%;
}
.ent:focus{outline:none;border-color:var(--brasa);background:var(--noche)}
textarea.ent{resize:vertical;min-height:76px;line-height:1.5}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.op{
  padding:10px 16px;border-radius:var(--r-pill);border:1px solid var(--linea);
  background:var(--carbon-2);font-size:14.5px;
}
.op[aria-pressed="true"]{background:var(--brasa);border-color:var(--brasa);color:#fff;font-weight:600}

/* lista de la mesa */
.quien-lista{display:flex;flex-direction:column;gap:8px}
.quien{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:13px 16px;border-radius:var(--r);
  border:1px solid var(--linea);background:var(--carbon-2);
}
.quien:active{border-color:var(--brasa)}
.quien .cu{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  display:grid;place-items:center;background:var(--carbon);
  font-family:var(--f-titulo);font-weight:800;font-size:14px;
  color:var(--ceniza);border:1px solid var(--linea);
}
.quien .nm{font-size:15.5px;font-weight:500}
.quien .sb{font-size:12.5px;color:var(--humo);margin-top:1px}
.quien.tomado{opacity:.42}
.quien.tomado .sb{color:var(--brasa)}

/* anfitrión */
.anf-mesa{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:9px}
.anf-p{
  border-radius:var(--r);padding:10px 6px;text-align:center;
  background:var(--carbon-2);border:1px solid var(--linea);
}
.anf-p .nn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anf-p .bar{height:5px;border-radius:3px;background:var(--linea);margin-top:7px;overflow:hidden}
.anf-p .bar i{display:block;height:100%;background:var(--brasa);border-radius:3px}
.anf-p.pide{border-color:var(--alerta);background:rgba(222,49,38,.16)}
.anf-p .pd{font-family:var(--f-dato);font-size:10px;color:var(--alerta);margin-top:5px}

#aviso{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
  z-index:80;background:var(--hueso);color:var(--noche);
  padding:11px 20px;border-radius:var(--r-pill);font-size:14.5px;font-weight:600;
  box-shadow:0 12px 34px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
#aviso.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="brasa-fondo" aria-hidden="true"></div>
<header class="marca" id="marca">
  <span class="sello" id="sello"></span>
  <span class="nombre" id="nombreMarca">Sticky Knife</span>
  <span class="bajo" id="bajoMarca">Sabores y terpenos</span>
</header>

/* Una palabra = un chip, aunque la digan cinco. Ordenadas por eco. */
function agrupar(lista){
  const g={};
  lista.forEach(x=>{
    const k=String(x.palabra||"").toLowerCase().trim(); if(!k) return;
    if(!g[k]) g[k]={palabra:x.palabra,n:0,mia:false,quienes:[]};
    g[k].n++; g[k].quienes.push(x.nombre);
    if(S.yo&&x.cupo===S.yo.cupo) g[k].mia=true;
  });
  return Object.keys(g).map(k=>g[k]).sort((a,b)=>b.n-a.n||a.palabra.localeCompare(b.palabra,"es"));
}

function palabrasDe(n){

            .map(([nom,pal],i)=>({id:"sim"+n+i,pasoN:n,cupo:100+i,nombre:nom,palabra:pal,sim:true}));
  return reales.concat(sim);
}

/* ============================================================ nube */
async function conectar(){
  if(!window.claude||!window.claude.use) return;
  let db=null; try{ db=await window.claude.use("db"); }catch(e){}
  if(!db) return;
  DB=db; S.simulado=false;
  try{ ASSETS=await window.claude.use("assets"); }catch(e){ ASSETS=null; }

  DB.doc("noche/estado").onSnapshot(s=>{
    if(!s.exists) return;
    const d=s.data()||{};
    if(d.fase) S.fase=d.fase;
    if(typeof d.paso==="number") S.paso=d.paso;
    if(d.logoUrl!=null) S.logoUrl=d.logoUrl;
    S.verPaso=null; guardar(); pintar();
  }, err);
  DB.collection("palabras").onSnapshot(s=>{
    S.palabras=s.docs.map(x=>Object.assign({id:x.id},x.data()||{})); guardar(); pintar();
  }, err);
  DB.collection("pulso").onSnapshot(s=>{
    S.pulso={}; s.docs.forEach(x=>{ S.pulso[x.id]=Object.assign({},x.data()||{}); }); pintar();
  }, err);
  DB.collection("fotos").onSnapshot(s=>{
    S.fotos=s.docs.map(x=>Object.assign({id:x.id},x.data()||{})); guardar(); pintar();
  }, err);
  pintar();
}
function err(e){
  const c=e&&e.code;
  if(c==="revoked"){ DB=null; S.simulado=true; aviso("Se cortó la conexión. Seguís viendo la noche."); }
  else if(c==="quota_exceeded") aviso("No entra más. Avisale al anfitrión.");
  else if(c==="resource_exhausted") aviso("Esperá un segundo y probá de nuevo.");
}
async function nube(col,id,datos){
  if(!DB) return;
  try{ await DB.doc(col+"/"+id).set(datos); }catch(e){ err(e); }
}
async function estadoNube(patch){
  Object.assign(S,patch); guardar(); pintar();
  if(DB){ try{ await DB.doc("noche/estado").set({fase:S.fase,paso:S.paso,logoUrl:S.logoUrl}); }catch(e){ err(e); } }
}

/* ============================================================ PINTAR */
function pintar(){
  const act=document.activeElement;
  const foco=act&&act.id&&$("#vista").contains(act)?act.id:null;
  const sel=foco&&act.selectionStart!=null?[act.selectionStart,act.selectionEnd]:null;

  $("#sello").innerHTML = S.logoUrl ? '<img src="'+esc(S.logoUrl)+'" alt="Sticky Knife">' : SELLO;

  let v;
  if(!S.yo) v=vistaQuien();
  else if(S.fase==="antes") v=vistaAntes();
  else if(S.fase==="despues") v=vistaDespues();
  else if(S.paso===0) v=vistaEspera();
  else v=vistaPaso();

  $("#marca").classList.toggle("chica", !!v.chica);
  $("#vista").innerHTML=v.html;
  const b=$("#barra");
  b.hidden=!v.barra;
  $("#barraDentro").innerHTML=v.barra||"";

  const p=pasoActual();
  $("#velaQ").textContent = (S.fase==="curso"&&p) ? p.extracto : "";

  if(foco){ const el=$("#"+foco); if(el&&el.focus){ el.focus(); if(sel&&el.setSelectionRange){try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}} } }
}

   + p.ritual.map((t,i)=>'<li><span class="paso-i">'+(i+1)+'</span><span class="txt">'+t+'</span></li>').join("")
   + '</ol></div>';

/* ============================================================ fotos */
function reducir(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("lectura"));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error("imagen"));
      im.onload=()=>{
        const e=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas");
        c.width=Math.round(im.width*e); c.height=Math.round(im.height*e);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        const url=c.toDataURL("image/jpeg",.74);
        c.toBlob(b=>res({blob:b,url:url}), "image/jpeg",.74);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function sumarFoto(){
  const p=pasoActual(); if(!p) return;
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.setAttribute("capture","environment");
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    aviso("Guardando la foto…");
    try{
      const r=await reducir(f,1100);
      let url=r.url;
      if(ASSETS&&r.blob){
        try{ const a=await ASSETS.upload(r.blob); url="/_blob/"+a.id; }
        catch(e){ if(e&&e.code==="too_large"){ aviso("La foto pesa demasiado."); return; } }
      }
      const foto={id:uid("f"),pasoN:p.n,url:url,cupo:S.yo?S.yo.cupo:0,nombre:S.yo?S.yo.nombre:""};
      S.fotos=S.fotos.concat([foto]);
      try{ guardar(); }catch(e){}
      nube("fotos",foto.id,foto); pintar(); aviso("Quedó en el álbum");
    }catch(e){ aviso("No se pudo guardar esa foto."); }
  });
  inp.click();
}

/* ============================================================ el pulso */
function ponerPulso(v){
  if(!S.yo) return;
  v=clamp(Math.round(v),0,100);
  const p=Object.assign({},S.pulso[S.yo.cupo]||{},{cupo:S.yo.cupo,nombre:S.yo.nombre,valor:v});
  S.pulso[S.yo.cupo]=p;
  const riel=$("#riel");
  if(riel){
    riel.setAttribute("aria-valuenow",v);
    $(".pulso-lleno",riel).style.width=v+"%";
    $(".pulso-perilla",riel).style.left=v+"%";
    const l=$(".pulso-lectura"); if(l) l.textContent=textoPulso(v);
  }
  clearTimeout(ponerPulso._t);
  ponerPulso._t=setTimeout(()=>nube("pulso",String(S.yo.cupo),p),450);
}
function rielDesde(ev,riel){
  const r=riel.getBoundingClientRect();
  const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  return clamp(100*x/Math.max(1,r.width),0,100);
}
document.addEventListener("pointerdown",e=>{
  const riel=e.target.closest("#riel"); if(!riel) return;
  riel.setPointerCapture&&riel.setPointerCapture(e.pointerId);
  ponerPulso(rielDesde(e,riel));
  const mover=ev=>ponerPulso(rielDesde(ev,riel));
  const soltar=()=>{ document.removeEventListener("pointermove",mover); document.removeEventListener("pointerup",soltar); };
  document.addEventListener("pointermove",mover);
  document.addEventListener("pointerup",soltar);
});
document.addEventListener("keydown",e=>{
  if(e.target.id!=="riel") return;
  const a=S.yo?(S.pulso[S.yo.cupo]||{}).valor||50:50;
  if(e.key==="ArrowRight"||e.key==="ArrowUp"){ e.preventDefault(); ponerPulso(a+5); }
  if(e.key==="ArrowLeft"||e.key==="ArrowDown"){ e.preventDefault(); ponerPulso(a-5); }
});

/* ============================================================ la vela */
let velaT=null;
function despertar(){
  document.body.classList.remove("velando");
  clearTimeout(velaT);
  if(S.fase!=="curso"||!S.yo) return;
  velaT=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)) return despertar();
    if(!$("#velo").hidden) return despertar();
    document.body.classList.add("velando");
  },28000);
}
["pointerdown","keydown","touchstart","focusin"].forEach(ev=>
  document.addEventListener(ev,despertar,{passive:true}));

/* ============================================================ eventos */
let toquesSello=0, selloT=null;
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-act],[data-rest],#sello");
  if(!t) return;

  if(t.id==="sello"){
    toquesSello++; clearTimeout(selloT);
    selloT=setTimeout(()=>{toquesSello=0;},1400);
    if(toquesSello>=4){ toquesSello=0; panelAnfitrion(); }
    return;
  }
  if(t.dataset.rest!=null){
    e.preventDefault();
    t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")==="true"?"false":"true");
    return;
  }

  const a=t.dataset.act;
  if(a!=="ok"&&a!=="cerrar") e.preventDefault();

  switch(a){
    case "ok": e.preventDefault(); if(!alOk||alOk()!==false) cerrar(); break;
    case "cerrar": e.preventDefault(); cerrar(); break;

    case "soy":
      S.yo={cupo:parseInt(t.dataset.cupo,10),nombre:t.dataset.nombre};
      guardar(); pintar(); despertar();
      aviso("Hola, "+S.yo.nombre.split(" ")[0]);
      break;
    case "soy-otro":
      hoja({titulo:"¿Cómo te llamás?", si:"Entrar",
        cuerpo:'<div class="campo"><label>Tu nombre</label>'
          + '<input class="ent" name="nombre" id="nomOtro" placeholder="Nombre y apellido" autocomplete="name"></div>',
        onOk:()=>{
          const v=campos(); if(!String(v.nombre||"").trim()){ aviso("Poné tu nombre."); return false; }
          const libre=MESA.find(m=>m.nombre==="Cupo libre");
          S.yo={cupo:libre?libre.cupo:99,nombre:v.nombre.trim()};
          if(libre) libre.nombre=S.yo.nombre;
          guardar(); pintar(); despertar(); return true;
        }});
      break;

    case "sug":{
      const w=t.dataset.w;
      const inp=$("#miPalabra"); if(inp) inp.value=w;
      $$(".sug[data-act=sug]").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));
      break;
    }
    case "decir": decir(); break;
    case "cambiar":{
      const p=pasoActual();
      const mias=misPalabras(p.n);
      S.palabras=S.palabras.filter(x=>mias.indexOf(x)<0);
      if(DB) mias.forEach(m=>{ DB.doc("palabras/"+m.id).delete().catch(err); });
      guardar(); pintar();
      break;
    }
    case "ver": S.verPaso=parseInt(t.dataset.n,10); pintar(); window.scrollTo(0,0); break;
    case "volver-actual": S.verPaso=null; pintar(); window.scrollTo(0,0); break;

    case "restricciones": formRestricciones(); break;
    case "ayuda": pedirAyuda(); break;
    case "foto": sumarFoto(); break;

    /* anfitrión */
    case "fase": estadoNube({fase:t.dataset.k, verPaso:null}); panelAnfitrion(); break;
    case "paso-mas": estadoNube({paso:clamp(S.paso+1,0,PASOS.length), verPaso:null}); panelAnfitrion(); break;
    case "paso-menos": estadoNube({paso:clamp(S.paso-1,0,PASOS.length), verPaso:null}); panelAnfitrion(); break;
    case "listo-ayuda":
      Object.keys(S.pulso).forEach(k=>{
        if(S.pulso[k].ayuda){ S.pulso[k]=Object.assign({},S.pulso[k],{ayuda:false}); nube("pulso",k,S.pulso[k]); }
      });
      panelAnfitrion(); pintar();
      break;
    case "subir-logo": subirLogo(); break;
    case "quitar-logo": estadoNube({logoUrl:""}); panelAnfitrion(); break;
    case "salir-mesa": S.yo=null; try{localStorage.removeItem(LS_YO);}catch(x){} cerrar(); pintar(); break;
  }
});

function decir(){
  const p=pasoActual(); if(!p||!S.yo) return;
  const inp=$("#miPalabra");
  const w=String(inp?inp.value:"").trim();
  if(!w){ aviso("Tocá una palabra o escribí la tuya."); if(inp) inp.focus(); return; }
  const o={id:uid("p"),pasoN:p.n,cupo:S.yo.cupo,nombre:S.yo.nombre,palabra:w.slice(0,28)};
  S.palabras=S.palabras.concat([o]);
  guardar(); nube("palabras",o.id,o); pintar();
  aviso("Sumada a la mesa");
}

document.addEventListener("submit",e=>{
  if(e.target.id==="hojaForm"){ e.preventDefault(); if(!alOk||alOk()!==false) cerrar(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#velo").hidden) cerrar();
  if(e.key==="Enter"&&e.target.id==="miPalabra"){ e.preventDefault(); decir(); }
});
$("#velo").addEventListener("click",e=>{ if(e.target.id==="velo") cerrar(); });
document.addEventListener("click",e=>{
  const op=e.target.closest(".op[data-op]");
  if(!op) return;
  $$(".op[data-op='"+op.dataset.op+"']").forEach(b=>b.setAttribute("aria-pressed","false"));
  op.setAttribute("aria-pressed","true");
});

async function subirLogo(){
  if(!ASSETS){ aviso("Hace falta estar conectado a la nube."); return; }
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/png,image/jpeg,image/webp,image/svg+xml";
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{
      const r=await ASSETS.upload(f);
      estadoNube({logoUrl:"/_blob/"+r.id});
      cerrar(); aviso("Logo puesto");
    }catch(e){ aviso("No se pudo subir el logo."); }
  });
  inp.click();
}

/* ============================================================ arranque */
leer();
if(location.hash==="#anfitrion") setTimeout(panelAnfitrion,300);
pintar();
despertar();
conectar();

})();
</script>
